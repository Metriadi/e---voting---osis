<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-VOTING OSIS SMPN 31 - 2025</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#eef2ff;padding:15px}
.header{background:#1e3c72;color:white;text-align:center;padding:20px;border-radius:15px;margin-bottom:20px}
.grid{max-width:1000px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.1);text-align:center}
.card img{width:100%;height:350px;object-fit:cover}
.info{padding:12px}
.btn{width:100%;padding:10px;border:none;border-radius:8px;color:white;font-weight:bold;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<div class="header"><h1>E-VOTING OSIS SMPN 31</h1><p>2025/2026 - Pilih 1 Paslon</p></div>
<div class="grid">
<div class="card"><img src="calon01.jpeg"><div class="info"><b>PASLON 01</b><br>M. IQBAL & M. FADLY<br><button class="btn" style="background:#1e293b" onclick="vote(0)">VOTE 01</button></div></div>
<div class="card"><img src="calon02.jpeg"><div class="info"><b>PASLON 02</b><br>RISTY & NURLAILA<br><button class="btn" style="background:#dc2626" onclick="vote(1)">VOTE 02</button></div></div>
<div class="card"><img src="calon03.jpeg"><div class="info"><b>PASLON 03</b><br>MUTIA & RAMONA<br><button class="btn" style="background:#065f46" onclick="vote(2)">VOTE 03</button></div></div>
</div>
<div style="max-width:1000px;margin:20px auto;background:white;padding:15px;border-radius:15px;text-align:center">
<h3>📊 HASIL LIVE</h3><div id="hasil" style="margin-top:10px"></div>
<p style="margin-top:10px">Total: <span id="total">0</span> suara</p>
<button onclick="resetVote()" style="margin-top:10px;padding:6px 12px;background:#ef4444;color:white;border:none;border-radius:5px">Reset Panitia</button>
</div>
<script>
let votes=JSON.parse(localStorage.getItem('osis2025')||'[0,0,0]');let voted=localStorage.getItem('osis_voted');
function vote(i){if(voted){alert('Sudah memilih!');return}votes[i]++;localStorage.setItem('osis2025',JSON.stringify(votes));localStorage.setItem('osis_voted','1');render();alert('Makasih! Vote Paslon 0'+(i+1)+' masuk!')}
function render(){let t=votes.reduce((a,b)=>a+b,0);document.getElementById('total').innerText=t;let h='';votes.forEach((v,i)=>{let p=t==0?0:Math.round(v/t*100);h+=`0${i+1}: ${v} suara (${p}%)<div style="background:#e2e8f0;height:18px;border-radius:9px;margin:5px 0"><div style="width:${p}%;background:#1e3c72;height:100%;border-radius:9px"></div></div>`});document.getElementById('hasil').innerHTML=h}
function resetVote(){if(confirm('Reset?')){localStorage.clear();votes=[0,0,0];render()}}render();
</script>
</body>
</html>
