<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-VOTING OSIS SMPN 31</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#eef2ff;padding:15px}
.header{background:#1e3c72;color:white;text-align:center;padding:20px;border-radius:15px;margin-bottom:15px}
.grid{max-width:1000px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.1);text-align:center}
.card img{width:100%;height:330px;object-fit:cover}
.info{padding:10px}
.btn{width:100%;padding:10px;border:none;border-radius:8px;color:white;font-weight:bold;cursor:pointer}
.btn:disabled{background:#94a3b8!important;cursor:not-allowed}
.result{max-width:1000px;margin:15px auto;background:white;padding:15px;border-radius:15px;text-align:center}
.bar{height:18px;background:#e2e8f0;border-radius:9px;margin:5px 0}
.fill{height:100%;background:#1e3c72;border-radius:9px}
</style>
</head>
<body>
<div class="header"><h1>E-VOTING OSIS SMPN 31</h1><p>2025/2026 - 1 HP 1 Suara</p></div>
<div class="grid">
<div class="card"><img src="calon01.jpeg"><div class="info"><b>PASLON 01</b><br>M.IQBAL & M.FADLY<br><button id="b0" class="btn" style="background:#1e293b" onclick="vote(0)">VOTE 01</button></div></div>
<div class="card"><img src="calon02.jpeg"><div class="info"><b>PASLON 02</b><br>RISTY & NURLAILA<br><button id="b1" class="btn" style="background:#dc2626" onclick="vote(1)">VOTE 02</button></div></div>
<div class="card"><img src="calon03.jpeg"><div class="info"><b>PASLON 03</b><br>MUTIA & RAMONA<br><button id="b2" class="btn" style="background:#065f46" onclick="vote(2)">VOTE 03</button></div></div>
</div>
<div class="result">
<h3>📊 HASIL LIVE</h3><div id="hasil"></div>
<p>Total: <b id="total">0</b> suara</p>
<p id="pesan" style="color:#dc2626;font-weight:bold;margin-top:8px"></p>
<button onclick="resetVote()" style="margin-top:10px;padding:6px 12px;background:#ef4444;color:white;border:none;border-radius:5px">Reset Panitia</button>
</div>
<script>
const KEY_VOTES='osis31_votes_final_2025';
const KEY_VOTED='osis31_sudah_memilih_2025';
let votes=JSON.parse(localStorage.getItem(KEY_VOTES)||'[0,0,0]');
let voted=localStorage.getItem(KEY_VOTED);
function vote(i){
 if(voted){alert('❌ HP INI SUDAH MEMILIH! 1 HP hanya boleh 1 suara.');return}
 votes[i]++;localStorage.setItem(KEY_VOTES,JSON.stringify(votes));localStorage.setItem(KEY_VOTED,'1');voted='1';
 alert('✅ Terima kasih! Suara untuk PASLON 0'+(i+1)+' BERHASIL masuk!');
 render();
}
function render(){
 let t=votes.reduce((a,b)=>a+b,0);
 document.getElementById('total').innerText=t;
 let h='';
 votes.forEach((v,i)=>{let p=t==0?0:Math.round(v/t*100);h+=`0${i+1}: ${v} suara (${p}%)<div class="bar"><div class="fill" style="width:${p}%"></div></div>`});
 document.getElementById('hasil').innerHTML=h;
 if(voted){
   document.getElementById('pesan').innerText='✅ HP ini sudah memilih, tidak bisa pilih lagi';
   document.getElementById('b0').disabled=true;document.getElementById('b1').disabled=true;document.getElementById('b2').disabled=true;
   document.getElementById('b0').innerText='SUDAH MEMILIH';document.getElementById('b1').innerText='SUDAH MEMILIH';document.getElementById('b2').innerText='SUDAH MEMILIH';
 }
}
function resetVote(){
 if(confirm('Yakin RESET semua suara jadi 0 untuk hari H?')){
  localStorage.removeItem(KEY_VOTES);localStorage.removeItem(KEY_VOTED);
  localStorage.removeItem('osis2025');localStorage.removeItem('osis_voted');localStorage.removeItem('osis_votes_final');localStorage.removeItem('osis_voted_final');
  votes=[0,0,0];voted=null;location.reload();
 }
}
render();
</script>
</body>
</html>
